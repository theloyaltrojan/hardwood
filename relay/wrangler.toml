# Cloudflare Worker config for the Hardwood Legends relay. Deploy with:  npx wrangler deploy
name = "hardwood-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the kind the free plan allows
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
